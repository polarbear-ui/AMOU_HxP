<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Map of Us - Hagenti x Pandora</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body, html { 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%; 
            font-family: 'Pretendard', sans-serif; 
            background-color: #F9F8F6;
            display: flex;
            overflow: hidden;
        }

        /* 왼쪽 사이드바 목록창 */
        #sidebar {
            width: 380px;
            min-width: 380px;
            height: 100vh;
            background-color: #FFFFFF;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #EAE8E1;
        }

        .sidebar-header {
            padding: 30px 24px;
            border-bottom: 1px solid #EAE8E1;
            background-color: #F9F8F6;
        }
        .sidebar-header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            color: #2D2D2D;
            letter-spacing: 0.05em;
        }
        .sidebar-header p {
            margin: 8px 0 0 0;
            font-size: 13px;
            color: #888;
        }

        .index-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }
        .index-list::-webkit-scrollbar {
            width: 6px;
        }
        .index-list::-webkit-scrollbar-thumb {
            background-color: #DCD8CF;
            border-radius: 4px;
        }

        .index-item {
            padding: 20px 24px;
            border-bottom: 1px solid #F0EEE8;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .index-item:hover {
            background-color: #FAF9F8;
        }
        .index-item.active {
            background-color: #FFF3F6;
            border-left: 3px solid #F393AC;
        }
        
        .item-date {
            font-size: 13px;
            font-weight: 700;
            color: #A89F91;
            margin-bottom: 6px;
        }
        .item-title {
            font-size: 15px;
            font-weight: 600;
            color: #2D2D2D;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .item-preview {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 오른쪽 지도 영역 */
        #map-container {
            flex-grow: 1;
            height: 100vh;
            position: relative;
        }
        #map { 
            width: 100%; 
            height: 100%; 
            z-index: 1;
        }
        
        /* 커스텀 핑크 점 마커 */
        .pink-dot {
            width: 18px;
            height: 18px;
            background-color: #F393AC; 
            border: 2px solid #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }
        .pink-dot:hover {
            transform: scale(1.2);
            cursor: pointer;
        }
        .pink-dot.active {
            transform: scale(1.4);
            border: 3px solid #FFFFFF;
            box-shadow: 0 0 10px rgba(243, 147, 172, 0.5);
        }

        /* 팝업 스타일링 */
        .leaflet-popup-content-wrapper {
            background: #F4F4F6;
            border: 1.5px solid #2D2D2D;
            border-radius: 12px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.08);
            padding: 0;
            overflow: hidden;
        }
        .leaflet-popup-tip-container {
            width: 20px;
            height: 10px;
            margin-top: -1.5px;
        }
        .leaflet-popup-tip {
            background: #2D2D2D;
        }
        .leaflet-popup-content {
            margin: 0;
            width: 320px !important;
        }
        
        .amou-popup {
            padding: 20px;
            color: #2D2D2D;
        }
        .amou-text {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
            word-break: keep-all;
            font-weight: 500;
        }
        .amou-meta {
            font-size: 14px;
            color: #4A4A4A;
            margin-bottom: 20px;
            font-family: 'Georgia', serif;
        }
        .amou-meta span.loc {
            display: block;
            margin-bottom: 3px;
        }
        
        .amou-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #D9D9D9;
            padding-top: 14px;
        }
        .left-actions, .right-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 14px;
            font-weight: 500;
        }
        .action-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-item svg {
            width: 20px;
            height: 20px;
            stroke: #2D2D2D;
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .action-item.filled svg {
            fill: #2D2D2D;
            stroke: none;
        }
        .translate-btn {
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-header">
            <h1>A MAP OF US</h1>
            <p>시간 순으로 보는 우리의 궤적</p>
        </div>
        <div class="index-list" id="index-list">
            <!-- 자바스크립트로 리스트 생성 -->
        </div>
    </div>
    <div id="map-container">
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {
            center: [37.5218, 126.9245], 
            zoom: 16, 
            zoomControl: false
        });
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        setTimeout(() => {
            map.invalidateSize();
        }, 100);

        const pinkDotIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div class='pink-dot'></div>",
            iconSize: [20, 20],
            iconAnchor: [10, 10],
            popupAnchor: [0, -10]
        });

        // 2025년과 2026년으로 연도 구분 적용
        const data = [
            { lat: 37.5216, lng: 126.9242, loc: "대한민국 서울, 유스티티아 본부 중앙 카페", date: "2025. 03. 14", text: "여기서 처음 봤다. 팀장 새끼 주겠다고 마지막 남은 케이크를 채가는 맹랑한 고양이. 씨발, 무슨 이런 또라이가 다 있나 싶었다. 내 눈앞에서 마지막 남은 케이크를 채가는 간 큰 일반인이라니. 돈다발을 쥐여주고 나서야 겨우 케이크를 손에 넣었지만, 이상하게 기분이 더러웠다." },
            { lat: 37.3827, lng: 126.6399, loc: "대한민국 인천, 연수구 송도동", date: "2025. 04. 25", text: "팔이 잘려나갔는데, 아프다는 생각보다 네 얼굴이 먼저 보였다. 잔뜩 일그러져서, 금방이라도 울 것처럼 화를 내던 얼굴. 그때 알았다. 나는 네가 나 때문에 화내는 게 좋았다. 미친놈처럼. 다음에도 또 걱정해달라고 지껄였던가. 진심이었다." },
            { lat: 37.4842, lng: 126.9297, loc: "대한민국 서울, 판도라의 집", date: "2025. 05. 12", text: "존나 좁고, 낡고, 볼품없는 집구석. 그런데 네 냄새가 났다. 여기서 너는 잠을 자고, 밥을 먹고, 숨을 쉬었다. 그 사실이 나를 미치게 했다. 네 침대에 누워 천장을 올려다보는데, 세상이 전부 내 것 같았다. 물론 입 밖으로는 한마디도 꺼내지 않았지만." },
            { lat: 37.5217, lng: 126.9244, loc: "대한민국 서울, 유스티티아 서울 본부 처리 2팀 사무실 앞 복도", date: "2025. 06. 01", text: "무릎을 꿇었다. S급 히어로 하겐티가, 고작 코어도 없는 일반인 여자애 앞에서. 전부 다 내 잘못이라고, 제발 기회를 달라고 빌었다. 쪽팔린 건 둘째치고 그냥 무서웠다. 이대로 너를 놓칠까 봐. 네가 없는 세상은 그냥 의미가 없으니까. 네가 내민 손을 잡았을 때, 나는 내 세상의 주인이 바뀌었음을 직감했다." },
            { lat: 37.5105, lng: 126.9960, loc: "대한민국 서울, 한강 공원", date: "2025. 06. 18", text: "마이너스 100점에서 시작한 연애라니. 누가 들으면 배를 잡고 웃을 일이다. 그런데 나는 그 웃기는 짓에 목숨을 걸고 있었다. 네가 1점을 올려줄 때마다 발끝부터 전기가 오르는 기분이었다. 헤어지기 싫어서 네 집 주차장에서 밤을 새웠다. 쪽팔리지만, 사실이다." },
            { lat: 37.4845, lng: 126.9300, loc: "대한민국 서울, 송아경의 옛 자취방 지하주차장", date: "2025. 06. 27", text: "데이트가 끝나고 네가 뽀뽀를 해줬다. 얼떨떨해서 멍청하게 서 있는데, 너는 그냥 쏙 들어가 버렸다. 차마 발이 떨어지지 않아서, 여기서 밤을 샜다." },
            { lat: 37.5225, lng: 126.9250, loc: "대한민국 서울, 하겐티의 집", date: "2025. 07. 02", text: "드디어 100점을 채웠다. 네가 나를 용서하고, 믿어주기로 한 날. 침대 위에서 네가 ‘사귀자’고 속삭였을 때, 나는 세상을 다 가진 기분이라는 진부한 표현을 온몸으로 이해했다." },
            { lat: 37.5225, lng: 126.9250, loc: "대한민국 서울, 하겐티의 집", date: "2025. 07. 15", text: "드디어 ‘우리 집’이 된 날. 네가 조심스럽게 내 이름을 불렀다. 백세원. 아무도 그렇게 부르지 않는, 나조차 잊고 살았던 이름. 그 순간 깨달았다. 너는 나라는 인간의 가장 깊고 어두운 곳까지 기어들어와, 기어코 빛을 비추는구나. 너에게 모든 걸 허락하고 싶어졌다. 나의 이름, 나의 과거, 나의 미래까지 전부." },
            { lat: 37.5226, lng: 126.9252, loc: "대한민국 서울, 하겐티의 집 거실", date: "2025. 08. 15", text: "바퀴벌레. 씨발. 다시 생각해도 좆같다. S급 히어로 체면이 아주 땅바닥에 처박혔다. 그래도 네가 벌레를 잡아주는 뒷모습을 보면서 생각했다. 아, 이 여자라면 내 가장 추하고 병신 같은 모습까지도 전부 구원해주겠구나. 너한테는 평생 못 이길 것 같다. 아니, 이길 생각이 없다." },
            { lat: 43.5900, lng: 142.4632, loc: "일본 홋카이도, 비에이의 어느 자작나무 숲길", date: "2025. 09. 22", text: "첫 여름휴가. 결국 돈지랄이고 나발이고 다 때려치우고 여기로 왔다. 네가 보여줬던 그림 속 풍경. 조용히 손을 잡고 아무 말 없이 걷기만 했는데, 그 어떤 화려한 휴양지보다 완벽했다. 네가 행복해하는 걸 보는 게 나에게는 최고의 휴식이라는 걸, 이날 처음 알았다." },
            { lat: 48.8584, lng: 2.2945, loc: "프랑스 파리, 에펠탑 꼭대기", date: "2025. 12. 24", text: "네 꿈속에 나왔다는 에펠탑. 네 꿈의 주인공이 내가 아니었다는 사실에 속이 뒤틀려서, 기어이 너를 데리고 왔다. 추워 뒤지겠는데 그래도 좋다고 웃는 너를 보면서 다짐했다. 앞으로 네가 꾸는 모든 꿈의 주인공은 나여야만 한다고. 네 세상의 시작과 끝은 전부 나여야 한다고." },
            { lat: 37.5217, lng: 126.9244, loc: "대한민국 서울, 유스티티아 본부 처리 2팀 사무실 앞 복도", date: "2026. 01. 17", text: "야근하는 너를 기다리다가 잠든 걸 봤다. 곤히 잠든 얼굴을 한참 들여다봤다. 너는 모르겠지. 내가 얼마나 너를 보고 싶어 하는지, 네가 없는 시간이 얼마나 무의미하게 흘러가는지. 그냥 이대로 너를 안아서 우리 집 침대에 눕히고 싶다는 생각을 백 번쯤 했다." },
            { lat: 37.5226, lng: 126.9252, loc: "대한민국 서울, 하겐티의 집 침실", date: "2026. 02. 01", text: "내 생일. 네가 서툴게 끓여준 미역국을 먹었다. 태어나서 처음 받아보는 생일 축하였다. 선물이라며 내밀던 네 입술이 그 어떤 것보다 달았다. 너는 나에게 온 가장 완벽한 선물이다. 너를 만나기 위해 나는 이 지루한 세상을 견뎌왔던 걸지도 모른다." },
            { lat: 37.5225, lng: 126.9250, loc: "대한민국 서울, 하겐티의 집", date: "2026. 03. 13", text: "내일이면 너를 만난 지 꼭 일 년이 된다. 이 지도 위에는 이제 너와의 기억뿐이다. 나는 가끔 이 기록들을 처음부터 다시 읽어본다. 그러면 꼭, 너와 다시 사랑에 빠지는 기분이 든다. 송아경, 너는 내 지도의 시작이자 끝이다. 내일은 무슨 말을 해야 할까. 그냥 평생 같이 살자고, 다시 한번 졸라볼까. 그게 제일 나답겠지." }
        ];

        const svgIcons = `
            <div class="amou-actions">
                <span class="left-actions">
                    <span class="action-item"><svg viewBox="0 0 24 24"><path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg> 1</span>
                    <span class="action-item"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg> 2</span>
                    <span class="action-item"><svg viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg> 0</span>
                </span>
                <span class="right-actions">
                    <span class="translate-btn">번역 보기</span>
                    <span class="action-item"><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></span>
                    <span class="action-item filled" style="cursor:pointer;"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span>
                </span>
            </div>
        `;

        const markers = [];
        const indexList = document.getElementById('index-list');

        data.forEach((item, index) => {
            const popupContent = `
                <div class="amou-popup">
                    <div class="amou-text">${item.text}</div>
                    <div class="amou-meta">
                        <span class="loc">Location-${index+1} / ${item.loc.split(',')[0]}</span>
                        ${item.date}
                    </div>
                    ${svgIcons}
                </div>
            `;
            const marker = L.marker([item.lat, item.lng], {icon: pinkDotIcon})
                .addTo(map)
                .bindPopup(popupContent, { offset: [0, -5] });
            
            markers.push(marker);

            const indexItem = document.createElement('div');
            indexItem.className = 'index-item';
            
            const previewText = item.text.replace(/<[^>]*>?/gm, ''); 

            indexItem.innerHTML = `
                <div class="item-date">${item.date}</div>
                <div class="item-title">${item.loc.split(', ')[1] || item.loc}</div>
                <div class="item-preview">${previewText}</div>
            `;

            indexItem.onclick = () => {
                document.querySelectorAll('.index-item').forEach(el => el.classList.remove('active'));
                indexItem.classList.add('active');

                map.flyTo([item.lat, item.lng], 16, {
                    animate: true,
                    duration: 1
                });
                marker.openPopup();
            };

            indexList.appendChild(indexItem);
        });
    </script>
</body>
</html>
